<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Book Marketplace</title>
    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
    <header>
        <h1><span class="brand-mark" aria-hidden="true">B.</span></h1>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="auth-container">
        <p class="eyebrow">YOUR NEXT CHAPTER</p><h2>Welcome back.</h2><p class="section-description">Sign in to share your books with their next reader.</p>
        <form id="login-form">
            <div class="form-group">
                <label for="login-username">Username:</label>
                <input type="text" id="login-username" autocomplete="username" required>
            </div>
            
            <div class="form-group">
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" autocomplete="current-password" required>
            </div>
            
            <button type="submit">Login</button>
        </form>
        <p id="show-register-prompt">
            Don't have an account?
            <button type="button" id="show-register">Create account</button>
        </p>
       

        <form id = "register-form" hidden>
            <div class="form-group">
                <label for="register-username"> Username:</label> 
                <input type = "text" id = "register-username" autocomplete="username" required>
            </div>
             <div class = "form-group">
                <label for = "register-email"> Email:</label>
                <input type = "email" id = "register-email" autocomplete="email" required>
            </div>
            
            <div class = "form-group">
                <label for = "register-password"> Password:</label>
                <input type = "password" id = "register-password" autocomplete= "new-password" required>
            </div>
           

            <button type = "submit"> Register</button>
        </form>
        <p id="show-login-prompt" hidden>
            Already have an account?
            <button type="button" id="show-login">Sign in</button>
        </p>


    </main>

    <script src="app.js?v=2"></script>
</body>
</html>
