<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Book Marketplace</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1><span class="brand-mark" aria-hidden="true">B.</span> Book Marketplace</h1>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="auth-container">
        <p class="eyebrow">YOUR NEXT CHAPTER</p><h2>Welcome back.</h2><p class="section-description">Sign in to share your books with their next reader.</p>
        <form id="login-form">
            <div class="form-group">
                <label for="login-username">Username:</label>
                <input type="text" id="login-username" autocomplete="username" required>
            </div>
            
            <div class="form-group">
                <label for="login-password">Password:</label>
                <input type="password" id="login-password" autocomplete="current-password" required>
            </div>
            
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? (You can register via Swagger at <a href="http://localhost:8000/docs" target="_blank">/docs</a>)</p>
    </main>

    <script src="app.js"></script>
</body>
</html>
